<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Alice</title>
<meta name="description" content="Monday 21 September.">
<meta name="theme-color" content="#1B0810">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Happy Birthday Alice">
<meta property="og:description" content="Monday 21 September. Open me first thing.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif;
  --ink:#F5EAE5;
  --dim:#A38D87;
  --rule:rgba(245,234,229,.15);
  --accent:#E2B591;
  --skin:radial-gradient(135% 85% at 50% -8%,#4A1220 0%,#250A11 44%,#0E0508 100%);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
button,a,input,summary{touch-action:manipulation}

/* one family, a different tone for each part of the day */
.t0{--skin:radial-gradient(135% 85% at 50% -8%,#5C2A18 0%,#2B1310 44%,#0E0707 100%);--accent:#EBBE93}
.t1{--skin:radial-gradient(135% 85% at 50% -8%,#4E1322 0%,#260A12 44%,#0E0508 100%);--accent:#E2B591}
.t2{--skin:radial-gradient(135% 85% at 50% -8%,#452A1A 0%,#20130C 44%,#0B0705 100%);--accent:#D7A97C}
.t3{--skin:radial-gradient(135% 85% at 50% -8%,#4B3826 0%,#1E1710 44%,#0A0806 100%);--accent:#E0C69E}
.t4{--skin:radial-gradient(135% 85% at 50% -8%,#15414B 0%,#0A1E24 44%,#040D10 100%);--accent:#9BD0CE}
.t5{--skin:radial-gradient(135% 85% at 50% -8%,#3E2449 0%,#1A0F20 44%,#0A060D 100%);--accent:#D3AEE4}
.t6{--skin:radial-gradient(135% 72% at 50% 112%,#6B3524 0%,#33201D 38%,#1A1416 68%,#0F0D10 100%);--accent:#D79A6A}
.t7{--skin:radial-gradient(125% 80% at 50% -8%,#1E2839 0%,#141B27 46%,#0A0D13 100%);--accent:#C9A176}
.tg{--skin:radial-gradient(115% 68% at 50% 20%,#241D19 0%,#17120F 52%,#0D0B0A 100%);--accent:#B98B63}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);font-weight:300;font-size:16.5px;line-height:1.65;
  color:var(--ink);background:#0E0508;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}

/* ---------- deck ---------- */
#deck{
  height:100svh;overflow-y:auto;overflow-x:hidden;
  scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;scrollbar-width:none;
}
#deck::-webkit-scrollbar{display:none}
.panel{
  position:relative;height:100svh;
  scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  background:var(--skin);color:var(--ink);
}
.panel[hidden]{display:none}
.shot{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.shot img{
  width:100%;height:100%;object-fit:cover;display:block;
  opacity:.92;filter:saturate(.9) contrast(1.02);
}
.shot::before{
  content:"";position:absolute;inset:0;
  background:var(--skin);opacity:.6;mix-blend-mode:multiply;
}
.shot::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(100deg,rgba(9,4,6,.82) 0%,rgba(9,4,6,.46) 50%,rgba(9,4,6,.12) 100%),
    linear-gradient(to bottom,rgba(9,4,6,.34) 0%,rgba(9,4,6,0) 30%,rgba(9,4,6,.7) 100%);
}
.pad{
  position:relative;z-index:1;
  width:100%;max-height:100%;overflow-y:auto;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top,0px) + 64px) 30px calc(env(safe-area-inset-bottom,0px) + 52px);
}
.pad::-webkit-scrollbar{display:none}
.inner{width:100%;max-width:460px;margin:0 auto}

/* ---------- type ---------- */
.eyebrow,.when{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;margin:0 0 20px}
.eyebrow{color:var(--dim)}
.when{color:var(--accent)}
h1{
  font-family:var(--display);font-optical-sizing:auto;font-weight:300;
  font-size:clamp(52px,15.5vw,106px);line-height:.94;letter-spacing:-.025em;margin:0;
}
h1 em{font-style:italic;font-weight:300}
h2{
  font-family:var(--display);font-optical-sizing:auto;font-weight:300;
  font-size:clamp(34px,9.4vw,54px);line-height:1.08;letter-spacing:-.022em;margin:0;
}
.lede{font-size:17px;color:var(--dim);margin:18px 0 0;max-width:30ch}
.sig{font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(21px,5.6vw,28px);line-height:1.4;margin:0}

/* ---------- buttons ---------- */
.btn{
  font:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);background:rgba(245,234,229,.1);border:0;border-radius:999px;
  padding:13px 22px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background .2s ease,transform .1s ease;text-decoration:none;display:inline-block;
}
.btn:active{transform:scale(.97)}
.btn.solid{background:var(--accent);color:#1C0910;font-weight:500}
.btn.ghost{background:none;color:var(--dim);padding-left:0}
.next{margin:26px 0 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.next.mid{justify-content:center;margin-top:14px}

/* ---------- the present ---------- */
.giftwrap{margin:22px 0 0;display:flex;flex-direction:column;align-items:center}
.gift{
  position:relative;width:200px;height:206px;background:none;border:0;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.gift .glow{
  position:absolute;left:50%;top:56%;width:280px;height:280px;margin:-140px 0 0 -140px;
  border-radius:50%;pointer-events:none;opacity:0;transition:opacity .6s ease;
  background:radial-gradient(circle,rgba(226,181,145,.5) 0%,rgba(226,181,145,.11) 46%,transparent 70%);
}
.gift.lit .glow{opacity:.75}
.gift .rays{position:absolute;left:50%;top:56%;width:0;height:0;opacity:0;pointer-events:none}
.gift .rays i{
  position:absolute;left:-1.5px;top:0;width:3px;height:30px;border-radius:2px;
  background:var(--accent);transform-origin:50% 0;
}
.gift .body{position:absolute;inset:0;transform-origin:50% 88%;animation:float 3.4s ease-in-out infinite}
.gift .box{
  position:absolute;left:14px;right:14px;bottom:6px;height:110px;border-radius:9px;
  background:linear-gradient(158deg,#6E1C2C 0%,#4B1221 56%,#330C16 100%);
  box-shadow:0 20px 42px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.09);
}
.gift .lid{
  position:absolute;left:0;right:0;top:54px;height:33px;border-radius:7px;
  background:linear-gradient(158deg,#812333 0%,#5C1728 58%,#3F1021 100%);
  box-shadow:0 12px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
}
.gift .box b,.gift .lid b{
  position:absolute;left:50%;margin-left:-11px;top:0;bottom:0;width:22px;
  background:var(--accent);opacity:.92;
}
.gift .bow{position:absolute;left:50%;top:-27px;width:80px;height:34px;margin-left:-40px}
.gift .bow i{position:absolute;background:var(--accent)}
.gift .bow .k{z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.gift .bow .l{left:0;top:0;width:37px;height:30px;border-radius:62% 38% 52% 48% / 62% 62% 38% 38%;transform:rotate(-15deg)}
.gift .bow .r{right:0;top:0;width:37px;height:30px;border-radius:38% 62% 48% 52% / 62% 62% 38% 38%;transform:rotate(15deg)}
.gift .bow .k{left:50%;top:8px;width:19px;height:19px;margin-left:-9.5px;border-radius:50%}
.gifthint{font-size:12.5px;color:var(--dim);margin:14px 0 0;letter-spacing:.04em;min-height:1.3em}

@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-7px) rotate(-1.2deg)}}
@keyframes wob1{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes wob2{
  0%,100%{transform:rotate(0deg) translateY(0)}
  12%{transform:rotate(-10deg) translateY(-3px)}
  30%{transform:rotate(9deg) translateY(-6px)}
  48%{transform:rotate(-8deg) translateY(-2px)}
  66%{transform:rotate(7deg) translateY(-5px)}
  84%{transform:rotate(-4deg) translateY(0)}
}
.gift.s1 .body{animation:wob1 .5s ease-in-out}
.gift.s2 .body{animation:wob2 .72s ease-in-out}
.gift.open .body{animation:none}
.gift.open .lid{
  transform:translate(46px,-132px) rotate(-24deg);opacity:0;
  transition:transform .85s cubic-bezier(.16,.9,.3,1), opacity .45s ease .4s;
}
.gift.open .box{
  transform:translateY(22px) scale(.88);opacity:0;
  transition:transform .7s ease .08s, opacity .55s ease .12s;
}
.gift.open .glow{opacity:0;transition:opacity 1s ease .25s}
.gift.open .rays{opacity:1;animation:burst .9s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes burst{
  0%{opacity:1;transform:scale(.2)}
  60%{opacity:.75}
  100%{opacity:0;transform:scale(2)}
}
.qrs{display:flex;gap:12px;margin:24px 0 0}
.qr{flex:1;background:#fff;border-radius:6px;padding:11px}
.qr img{width:100%;height:auto;display:block;image-rendering:pixelated}
.qr p{margin:8px 0 0;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#8E1F2F;text-align:center}
.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* ---------- wheel ---------- */
.wheelwrap{
  position:relative;width:min(94vw,348px);padding:26px;margin:0 auto;
  touch-action:none;cursor:grab;
}
.wheelwrap:active{cursor:grabbing}
.wheelspin{width:100%;transition:transform 3.6s cubic-bezier(.15,.85,.25,1)}
.wheelspin svg{display:block;width:100%;height:auto}
.ptr{
  position:absolute;top:22px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;
  border-top:17px solid var(--accent);z-index:3;pointer-events:none;
}
.result{min-height:136px;margin:14px 0 0;text-align:center}
.result .rd{font-size:13.5px;line-height:1.45;color:var(--dim);margin:7px auto 0;max-width:32ch}
.result .rc{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0}
.result .rn{
  font-family:var(--display);font-optical-sizing:auto;font-weight:300;
  font-size:26px;line-height:1.15;margin:5px 0 0;letter-spacing:-.015em;
}
.result .ra{display:flex;gap:9px;justify-content:center;margin:12px 0 0;flex-wrap:wrap}
.result .ra .btn{font-size:10px;padding:11px 17px}

/* ---------- countdown ---------- */
.cd{display:flex;gap:16px;margin:24px 0 0}
.cd div{text-align:left}
.cd b{
  display:block;font-family:var(--display);font-optical-sizing:auto;font-weight:300;
  font-size:40px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
}
.cd span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:7px;display:block}
.cdnote{font-size:12.5px;color:var(--dim);margin:14px 0 0;letter-spacing:.04em}

/* ---------- gate ---------- */
.gate .inner{text-align:center}
.clock{
  font-family:var(--display);font-optical-sizing:auto;font-weight:300;
  font-size:clamp(58px,18vw,96px);line-height:1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;margin:26px 0 22px;display:block;
}
.meter{height:1px;background:rgba(245,234,229,.16);position:relative;margin:0 0 20px}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0%;transition:width 1s linear}
.gate .lede{margin:0 auto;max-width:26ch}
.unlock-at{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:20px 0 0}
.pw{display:flex;flex-direction:column;align-items:center;gap:11px;margin:30px 0 0}
.pwdots{display:flex;gap:7px;height:7px}
.pwdots i{width:7px;height:7px;border-radius:50%;background:rgba(245,234,229,.18);transition:background .2s ease}
.pwdots i.on{background:var(--accent)}
.pwkeys{display:flex;gap:3px;justify-content:center}
.pwkeys button{
  width:27px;height:27px;border-radius:50%;border:0;padding:0;
  font:inherit;font-size:12px;line-height:1;color:var(--dim);
  background:rgba(245,234,229,.07);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .15s ease,color .15s ease;
}
.pwkeys button:active{background:rgba(245,234,229,.2);color:var(--ink)}
.pw.no{animation:no .4s ease}
@keyframes no{
  10%,90%{transform:translateX(-3px)} 30%,70%{transform:translateX(5px)} 50%{transform:translateX(-5px)}
}

/* ---------- fixed chrome ---------- */
.topfade,.botfade{position:fixed;left:0;right:0;pointer-events:none}
.topfade{
  top:0;height:80px;z-index:20;
  background:linear-gradient(to bottom,rgba(10,5,7,.94) 0%,rgba(10,5,7,.64) 44%,rgba(10,5,7,0) 100%);
}
.botfade{
  bottom:0;height:64px;z-index:3;
  background:linear-gradient(to top,rgba(10,5,7,.9) 0%,rgba(10,5,7,0) 100%);
}
.prog{position:fixed;top:0;left:0;right:0;height:2px;background:rgba(245,234,229,.14);z-index:40}
.prog i{display:block;height:100%;width:0%;background:var(--accent);transition:width .9s cubic-bezier(.2,.7,.2,1)}
.count{
  position:fixed;z-index:40;left:16px;top:calc(env(safe-area-inset-top,0px) + 14px);
  font-size:10px;letter-spacing:.2em;color:var(--dim);font-variant-numeric:tabular-nums;
}
.bar{
  position:fixed;z-index:30;right:12px;left:auto;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  display:flex;gap:6px;
}
.bar button{
  font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:400;
  color:var(--ink);background:rgba(245,234,229,.16);border:0;border-radius:999px;
  padding:10px 14px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.35);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  -webkit-tap-highlight-color:transparent;
}
.bar button:active{transform:scale(.97)}
.bar button[hidden]{display:none}
.more-below{
  position:absolute;left:50%;transform:translateX(-50%);z-index:4;pointer-events:none;
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
  margin:0;padding:6px 13px;border-radius:999px;background:rgba(10,5,7,.8);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;transition:opacity .4s ease;
}
.more-below.on{opacity:.85;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,4px)}}
.hint{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  text-align:center;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);
}

/* ---------- sheets ---------- */
.sheet{
  position:fixed;inset:0;z-index:60;overflow-y:auto;background:#130609;color:var(--ink);
  padding:calc(env(safe-area-inset-top,0px) + 30px) 0 calc(env(safe-area-inset-bottom,0px) + 48px);
  animation:fade .3s ease both;
}
.sheet[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.box{max-width:460px;margin:0 auto;padding:0 30px}
.sheet h3{
  font-family:var(--display);font-optical-sizing:auto;font-weight:300;
  font-size:clamp(30px,8vw,42px);line-height:1.1;margin:0 0 8px;letter-spacing:-.022em;padding-right:48px;
}
.sheet .sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 26px}
.closex{
  position:fixed;z-index:6;
  top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;
  width:40px;height:40px;border-radius:50%;font:inherit;font-size:18px;line-height:1;
  color:var(--ink);background:rgba(28,16,18,.72);border:0;cursor:pointer;
  display:grid;place-items:center;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 2px 14px rgba(0,0,0,.4);
}

/* the whole day */
.tl{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.tl li{display:flex;gap:18px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--rule)}
.tl .t{flex:none;width:76px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:500}
.tl .n{font-family:var(--display);font-optical-sizing:auto;font-size:20px;line-height:1.3;font-weight:300}
.tl .locked{color:#6A5550;font-family:var(--display);font-style:italic;font-weight:300;font-size:19px}
.tl li.is-next .t{color:var(--accent)}

/* places, set like the pass list */
.gets li a{
  flex:1;min-width:0;display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;
}
.gets li a:active{opacity:.55}

/* passes */
.pass{background:#fff;padding:22px 20px 18px;text-align:center;color:#1F1613;margin:0 0 14px;border-radius:6px}
.pass img{width:100%;max-width:210px;height:auto;image-rendering:pixelated;margin:0 auto;display:block}
.pass .who{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;color:#8E1F2F;margin:0 0 16px}
.gets{list-style:none;margin:24px 0 0;padding:0}
.gets li{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  font-size:15.5px;line-height:1.35;color:var(--ink);padding:10px 0;
}
.gets li em{font-style:normal;flex:1;min-width:0}
.gets li em .gd{
  display:block;font-size:12.5px;line-height:1.42;color:#8A756E;margin:3px 0 0;
}
.gets li > span{flex:none;color:var(--accent);font-size:11.5px;letter-spacing:.04em}
.gets li.h{
  display:block;color:var(--ink);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  font-weight:500;margin:22px 0 7px;padding:0 0 8px;border-bottom:1px solid var(--rule);
}
.gets li.h:first-child{margin-top:0}
.gets .note{font-size:11.5px;color:#6A5550;padding-top:10px;display:block}

/* ---------- motion ---------- */
.rise{animation:rise .95s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .rise,.sheet,.pop,.gift .body,.gift.s1 .body,.gift.s2 .body,.gift.open .rays,
  .more-below.on{animation:none}
  #deck{scroll-behavior:auto}
  .prog i,.meter i,.wheelspin{transition:none}
}

</style>
</head>
<body>

<div class="topfade" aria-hidden="true"></div>
<div class="botfade" aria-hidden="true"></div>
<div class="prog" id="prog" aria-hidden="true"><i></i></div>
<div class="count" id="count" aria-hidden="true"></div>

<main id="deck">

  <section class="panel">
    <div class="pad"><div class="inner">
      <p class="eyebrow rise">Dubrovnik &middot; Monday 21 September</p>
      <h1 class="rise d1">Happy<br>birthday<br><em>Alice</em></h1>
      <p class="lede rise d2">Today is planned. It comes to you one part at a time.</p>
      <div class="next rise d3"><button type="button" class="btn solid" data-next>Open the first one</button></div>
    </div></div>
    <p class="hint">Swipe up</p>
  </section>

  <section class="panel" id="outro" hidden>
    <div class="pad"><div class="inner">
      <p class="eyebrow">That is the day</p>
      <h2>All of it<br>is yours.</h2>
      <p class="sig" style="margin-top:34px">Happy birthday, beautiful.<br>All my love, Jake.</p>
    </div></div>
  </section>

</main>

<div class="bar">
  <button type="button" id="dayBtn">The whole day</button>
  <button type="button" id="passBtn" hidden>Our passes</button>
</div>

<section class="sheet" id="daySheet" hidden aria-labelledby="dayTitle">
  <div class="box">
    <button type="button" class="closex" data-close aria-label="Close">&times;</button>
    <h3 id="dayTitle">The whole day</h3>
    <p class="sub" id="daySub"></p>
    <ul class="tl" id="dayList"></ul>
  </div>
</section>

<section class="sheet" id="placeSheet" hidden aria-labelledby="placeTitle">
  <div class="box">
    <button type="button" class="closex" data-close aria-label="Close">&times;</button>
    <h3 id="placeTitle">Everything</h3>
    <p class="sub" id="placeSub"></p>

      state.pass = true; save();
      passBtn.hidden = false;
      paintDay();
      if(section.__cue) setTimeout(section.__cue, 80);
    }

    if(state.pass){ reveal(); return; }

    var STEPS = ["Something is in there", "One more"];
    function bump(cls){
      gift.classList.remove("s1","s2");
      void gift.offsetWidth;
      gift.classList.add(cls);
      setTimeout(function(){ gift.classList.remove(cls); }, 760);
    }

    gift.addEventListener("click", function(){
      if(done) return;
      stage++;
      if(stage < 3){
        bump("s" + stage);
        if(stage === 2) gift.classList.add("lit");
        hint.textContent = STEPS[stage - 1];
        return;
      }
      done = true;
      gift.classList.remove("s1","s2");
      gift.classList.add("open");
      hint.textContent = "";
      setTimeout(function(){
        reveal();
        qrs.classList.add("pop");
        covers.classList.add("pop");
      }, 680);
    });
  }

  /* ---------- the wheel ---------- */
  function wireWheel(section){
    var holder = section.querySelector("[data-wheel]");
    if(!holder) return;
    var wrap = holder.parentNode;
    var result = section.querySelector("[data-result]");
    var N = 12, SEG = 360 / N, R = 122, C = 132, SPINMS = 3400;
    var rot = 0, spinning = false, face = [];

    var SPINNABLE = PLACES.filter(function(pl){ return pl.s; });
    function sample(){
      var pool = SPINNABLE.slice(), picked = [];
      while(picked.length < N && pool.length){
        picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      }
      return picked;
    }

    function draw(items){
      face = items;
      var svg = '<svg viewBox="0 0 264 264" role="img" aria-label="Wheel of places in the Old Town">';
      for(var i=0;i<N;i++){
        var a0 = (-90 + i*SEG) * Math.PI/180, a1 = (-90 + (i+1)*SEG) * Math.PI/180;
        var x0 = C + R*Math.cos(a0), y0 = C + R*Math.sin(a0);
        var x1 = C + R*Math.cos(a1), y1 = C + R*Math.sin(a1);
        svg += '<path d="M' + C + ',' + C + ' L' + x0.toFixed(2) + ',' + y0.toFixed(2) +
               ' A' + R + ',' + R + ' 0 0 1 ' + x1.toFixed(2) + ',' + y1.toFixed(2) + ' Z" fill="rgba(' +
               catRgb(items[i].c) + ',' + (i % 2 ? ".34" : ".2") + ')" ' +
               'stroke="rgba(245,234,229,.14)" stroke-width="1"></path>';
      }
      for(var j=0;j<N;j++){
        var am = -90 + j*SEG + SEG/2;
        var norm = ((am % 360) + 360) % 360;
        var flip = norm > 90 && norm < 270;
        var label = items[j].w || items[j].n.replace(/&#382;/g, "\u017E").replace(/&#269;/g, "\u010D").replace(/&#263;/g, "\u0107");
        svg += '<g transform="rotate(' + (flip ? am + 180 : am).toFixed(2) + ' ' + C + ' ' + C + ')">' +
               '<text x="' + (flip ? C - R + 9 : C + R - 9) + '" y="' + C + '" ' +
               'text-anchor="' + (flip ? "start" : "end") + '" dominant-baseline="middle" ' +
               'font-family="Inter,sans-serif" font-size="9.5" fill="#F5EAE5" fill-opacity=".95">' +
               label + '</text></g>';
      }
      svg += '<circle cx="' + C + '" cy="' + C + '" r="' + R + '" fill="none" stroke="rgba(245,234,229,.32)" stroke-width="1.5"></circle>';
      svg += '<circle cx="' + C + '" cy="' + C + '" r="17" fill="#14090D" stroke="rgba(245,234,229,.32)" stroke-width="1.5"></circle>';
      holder.innerHTML = svg + '</svg>';
    }

    /* which segment sits under the pointer at a given rotation, and the
       nearest rotation that centres it there */
    function settle(target){
      var i = Math.round((-target - SEG/2) / SEG);
      return { i: ((i % N) + N) % N, rot: -(i*SEG + SEG/2) };
    }

    function showIdle(){
      result.innerHTML = '';
      var b = document.createElement("button");
      b.type = "button"; b.className = "btn solid"; b.textContent = "Spin";
      b.addEventListener("click", function(){ spin(); });
      result.appendChild(b);
      var hint = document.createElement("p");
      hint.className = "rd";
      hint.textContent = "or flick the wheel";
      result.appendChild(hint);
    }

    function showResult(i){
      var pl = face[i];
      result.innerHTML =
        '<p class="rc" style="color:rgb(' + catRgb(pl.c) + ')">' + pl.c + (pl.t ? " &middot; " + pl.t : "") + '</p>' +
        '<p class="rn">' + pl.n + '</p>' +
        '<p class="rd">' + (pl.d || "") + '</p>' +
        '<div class="ra">' +
          '<a class="btn" href="' + MAPS + encodeURIComponent(pl.q) + '" target="_blank" rel="noopener">Open in Maps</a>' +
          '<button type="button" class="btn solid" data-again>Spin again</button>' +
        '</div>';
      result.classList.remove("pop"); void result.offsetWidth; result.classList.add("pop");
      result.querySelector("[data-again]").addEventListener("click", function(){ spin(); });
    }

    function land(target){
      var s = settle(target);
      var base = Math.round((target - s.rot) / 360) * 360;
      rot = s.rot + base;
      holder.style.transition = "transform " + (SPINMS/1000) + "s cubic-bezier(.15,.85,.25,1)";
      holder.style.transform = "rotate(" + rot + "deg)";
      setTimeout(function(){ spinning = false; showResult(s.i); }, SPINMS + 60);
    }

    function spin(extraTurns){
      if(spinning) return;
      spinning = true;
      result.innerHTML = '<p class="rc">Spinning</p>';
      draw(sample());                       // a fresh twelve every time
      var turns = extraTurns || (4 + Math.random() * 2);
      land(rot + turns * 360 + Math.random() * 360);
    }

    /* ---- flick it with a finger ---- */
    var dragging = false, lastA = 0, lastT = 0, vel = 0, moved = 0;

    function angleAt(e){
      var r = holder.getBoundingClientRect();
      return Math.atan2(e.clientY - (r.top + r.height/2), e.clientX - (r.left + r.width/2)) * 180 / Math.PI;
    }

    wrap.addEventListener("pointerdown", function(e){
      if(spinning) return;
      dragging = true; moved = 0; vel = 0;
      lastA = angleAt(e); lastT = Date.now();
      try{ wrap.setPointerCapture(e.pointerId); }catch(err){}
      holder.style.transition = "none";
      e.preventDefault();
    });

    wrap.addEventListener("pointermove", function(e){
      if(!dragging) return;
      var a = angleAt(e), d = a - lastA;
      if(d > 180) d -= 360;
      if(d < -180) d += 360;
      var now = Date.now(), dt = Math.max(now - lastT, 8);
      vel = d / dt;                          // degrees per millisecond
      rot += d; moved += Math.abs(d);
      lastA = a; lastT = now;
      holder.style.transform = "rotate(" + rot + "deg)";
      e.preventDefault();
    });

    function release(e){
      if(!dragging) return;
      dragging = false;
      try{ wrap.releasePointerCapture(e.pointerId); }catch(err){}
      if(Date.now() - lastT > 140) vel = 0;  // a finger that stopped before lifting
      if(moved < 6 && Math.abs(vel) < 0.05){ spin(); return; }   // a tap
      spinning = true;
      result.innerHTML = '<p class="rc">Spinning</p>';
      var throwq = vel * 1100;
      if(Math.abs(throwq) < 700) throwq = (throwq < 0 ? -1 : 1) * (700 + Math.random() * 360);
      land(rot + throwq);
    }
    wrap.addEventListener("pointerup", release);
    wrap.addEventListener("pointercancel", release);

    /* touch-action alone is not enough inside a snapping scroller, so the
       wheel eats the touch outright and nothing underneath sees it */
    wrap.addEventListener("touchstart", function(e){ e.stopPropagation(); }, {passive:true});
    wrap.addEventListener("touchmove", function(e){
      e.preventDefault(); e.stopPropagation();
    }, {passive:false});
    wrap.addEventListener("touchend", function(e){ e.stopPropagation(); }, {passive:true});

    draw(sample());
    showIdle();
  }

  /* ---------- countdown to sunset ---------- */
  var cdEls = null;
  function wireSunset(section){
    var cd = section.querySelector("[data-cd]");
    if(!cd) return;
    cdEls = {
      h: cd.querySelector("[data-h]"), m: cd.querySelector("[data-m]"), s: cd.querySelector("[data-s]"),
      note: section.querySelector("[data-cdnote]"), box: cd
    };
    paintSunset();
  }
  function paintSunset(){
    if(!cdEls) return;
    var left = SUNSET - Date.now();
    if(left <= 0){
      cdEls.box.hidden = true;
      cdEls.note.textContent = left > -45*60*1000
        ? "The sun is going down right now."
        : "Sunset was at 19:15.";
      return;
    }
    cdEls.box.hidden = false;
    var s = Math.floor(left/1000);
    cdEls.h.textContent = two(Math.floor(s/3600));
    cdEls.m.textContent = two(Math.floor(s/60) % 60);
    cdEls.s.textContent = two(s % 60);
    cdEls.note.textContent = "until the sun goes down";
  }

  /* ---------- places sheet ---------- */
  document.getElementById("passGets").innerHTML = COVERS;

  var placeSub = document.getElementById("placeSub");
  (function buildPlaces(){
    var body = document.getElementById("placeBody");
    CATS.forEach(function(cat){
      var items = PLACES.filter(function(pl){ return pl.c === cat.n; });
      if(!items.length) return;

      var list = document.createElement("ul");
      list.className = "gets";

      var head = document.createElement("li");
      head.className = "h";
      head.style.color = "rgb(" + cat.rgb + ")";
      head.innerHTML = cat.n;
      list.appendChild(head);

      items.forEach(function(pl){
        var li = document.createElement("li");
        li.innerHTML =
          '<a href="' + MAPS + encodeURIComponent(pl.q) + '" target="_blank" rel="noopener">' +
            '<em>' + pl.n + (pl.d ? '<span class="gd">' + pl.d + '</span>' : '') + '</em>' +
            (pl.t ? '<span style="color:rgb(' + cat.rgb + ')">' + pl.t + '</span>' : '') +
          '</a>';
        list.appendChild(li);
      });
      body.appendChild(list);
    });
  })();
  function paintPlaceSub(){
    placeSub.textContent = PLACES.length + " places &middot; tap any of them for the map";
    placeSub.innerHTML = PLACES.length + " places &middot; tap any of them for the map";
  }

  /* ---------- reveal ---------- */
  function placeGate(){
    var next = sections[state.revealed];
    if(next){ gate.hidden = false; deck.insertBefore(gate, next); outro.hidden = true; }
    else{ gate.hidden = true; outro.hidden = false; }
  }

  var wired = {};
  function renderAll(scrollToNew){
    for(var i=0;i<sections.length;i++){
      sections[i].hidden = i >= state.revealed;
      if(!sections[i].hidden && !wired[i]){
        wired[i] = 1;
        wireGift(sections[i]); wireWheel(sections[i]); wireSunset(sections[i]);
      }
    }
    placeGate();
    document.querySelectorAll(".panel").forEach(function(el){
      if(el.__cue) setTimeout(el.__cue, 80);
    });
    progFill.style.width = (state.revealed / STOPS.length * 100) + "%";
    countEl.textContent = two(state.revealed) + " / " + two(STOPS.length);
    paintDay();
    if(scrollToNew){
      var target = sections[state.revealed - 1];
      if(target){
        target.querySelectorAll(".rise").forEach(function(el){
          el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
        });
        requestAnimationFrame(function(){ target.scrollIntoView({behavior:"smooth", block:"start"}); });
      }
    }
  }

  function catchUp(){
    var moved = false;
    while(state.revealed < STOPS.length && Date.now() >= state.nextAt){
      state.revealed++; state.nextAt += GAP; moved = true;
    }
    if(moved) save();
    return moved;
  }

  function tick(){
    paintSunset();
    if(state.revealed >= STOPS.length){ gate.hidden = true; outro.hidden = false; return; }
    var left = state.nextAt - Date.now();
    if(left <= 0){ if(catchUp()) renderAll(true); return; }
    var s = Math.ceil(left/1000);
    clockEl.textContent = two(Math.floor(s/60)) + ":" + two(s%60);
    meterFill.style.width = ((1 - Math.min(left/GAP,1)) * 100) + "%";
    unlockEl.textContent = "Opens at " + hhmm(state.nextAt);
  }

  /* ---------- the whole day ---------- */
  var dayList = document.getElementById("dayList");
  var daySub = document.getElementById("daySub");
  function paintDay(){
    dayList.innerHTML = "";
    STOPS.forEach(function(stop, i){
      var li = document.createElement("li");
      var t = document.createElement("span");
      t.className = "t"; t.innerHTML = stop.clock;
      var n = document.createElement("span");
      if(i < state.revealed){
        n.className = "n";
        n.innerHTML = (stop.shortLocked && !state.pass) ? stop.shortLocked : stop.short;
      }
      else{
        n.className = "locked"; n.textContent = "Still to come";
        if(i === state.revealed) li.className = "is-next";
      }
      li.appendChild(t); li.appendChild(n);
      dayList.appendChild(li);
    });
    daySub.textContent = state.revealed + " of " + STOPS.length + " open";
  }

  /* ---------- sheets ---------- */
  var openSheet = null;
  function show(el){
    if(openSheet) openSheet.hidden = true;
    el.hidden = false; openSheet = el; el.scrollTop = 0;
  }
  function hide(){ if(openSheet){ openSheet.hidden = true; openSheet = null; } }
  document.getElementById("dayBtn").addEventListener("click", function(){
    paintDay(); show(document.getElementById("daySheet"));
  });
  passBtn.addEventListener("click", function(){ show(document.getElementById("passSheet")); });
  document.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", hide); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") hide(); });

  deck.addEventListener("click", function(e){
    var t = e.target;
    if(!t || !t.closest) return;
    if(t.closest("[data-next]")){
      var sec = t.closest(".panel");
      if(sec) step(sec, 1);
    }else if(t.closest("[data-places]")){
      paintPlaceSub(); show(document.getElementById("placeSheet"));
    }
  });

  /* ---------- a card taller than the screen hands the scroll on ---------- */
  document.querySelectorAll(".panel").forEach(function(section){
    var pad = section.querySelector(".pad");
    if(!pad) return;
    var startY = 0, startTop = 0, lastMove = 0;

    var cue = document.createElement("p");
    cue.className = "more-below";
    cue.textContent = "More below";
    section.appendChild(cue);
    function paintCue(){
      var over = pad.scrollHeight - pad.clientHeight > 8;
      var atBottom = pad.scrollTop + pad.clientHeight >= pad.scrollHeight - 24;
      cue.classList.toggle("on", over && !atBottom);
    }
    pad.addEventListener("scroll", paintCue, {passive:true});
    window.addEventListener("resize", paintCue);
    section.__cue = paintCue;
    setTimeout(paintCue, 60);
    function overflows(){ return pad.scrollHeight - pad.clientHeight > 4; }
    function atEnd(){ return pad.scrollTop + pad.clientHeight >= pad.scrollHeight - 3; }
    function atStart(){ return pad.scrollTop <= 3; }
    function go(dir){
      var now = Date.now();
      if(now - lastMove < 800) return;
      lastMove = now; step(section, dir);
    }
    pad.addEventListener("touchstart", function(e){
      startY = e.touches[0].clientY; startTop = deck.scrollTop;
    }, {passive:true});
    pad.addEventListener("touchend", function(e){
      if(!overflows()) return;
      if(Math.abs(deck.scrollTop - startTop) > 6) return;
      var dy = e.changedTouches[0].clientY - startY;
      if(dy < -45 && atEnd()) go(1);
      else if(dy > 45 && atStart()) go(-1);
    }, {passive:true});
    pad.addEventListener("wheel", function(e){
      if(!overflows()) return;
      if(e.deltaY > 0 && atEnd()) go(1);
      else if(e.deltaY < 0 && atStart()) go(-1);
    }, {passive:true});
  });

  if("IntersectionObserver" in window){
    var rewind = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting){
          var pad = en.target.querySelector(".pad");
          if(pad && pad.scrollTop) pad.scrollTop = 0;
        }
      });
    }, {root:deck, threshold:0});
    document.querySelectorAll(".panel").forEach(function(el){ rewind.observe(el); });
  }

  /* ---------- go ---------- */
  if(/[?&]reset\b/.test(location.search)){
    try{ localStorage.removeItem(KEY); }catch(e){}
    location.replace(location.pathname);
    return;
  }
  if(!hadSaved){ state.nextAt = Date.now() + GAP; save(); }
  if(state.pass) passBtn.hidden = false;
  catchUp();
  paintPlaceSub();
  renderAll(false);
  tick();
  setInterval(tick, 1000);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){ if(catchUp()) renderAll(true); tick(); }
  });

})();
</script>
</body>
</html>
