# ---------------------------------------------------------------------------
# Your answer bank. Fill this in ONCE, honestly, and every quote journey gets
# filled from it. Copy to config/profile.yaml (gitignored) with `bqr init`.
#
# Everything here is an answer to a question a UK bike insurer will ask you.
# If a value is wrong the quote is worthless (and voidable), so take the time.
# ---------------------------------------------------------------------------

riders:
  # The first rider is the proposer / policyholder by default.
  - id: me
    role: proposer
    title: Mr
    firstName: Jake
    lastName: Rayner
    dateOfBirth: 1996-04-12
    gender: male
    maritalStatus: single          # single | married | cohabiting | divorced | widowed
    email: you@example.com
    phone: "07700900000"
    ukResidentSince: 2010-09-01    # or your date of birth if always resident
    homeowner: false
    employment:
      status: employed             # employed | self-employed | student | unemployed | retired
      occupation: Software Engineer
      industry: Computing
      secondJob: false
    licence:
      type: full
      number: RAYNE904126JX9AB
      provideNumber: false
      dateObtained: 2018-06-20
      countryOfIssue: UK
      ridingExperienceYears: 5
      advancedRiding: none
      bikingOrganisation: none
    carLicence:
      held: true
      type: Full UK
      dateObtained: 2014-06-30
      noClaimsBonusYears: 5
      ownsCar: true
    history:
      claims:
        - date: 2024-01-02
          type: other
          description: Other
          fault: true
          ownVehicleCost: 1500
          personalInjury: false
          onCurrentPolicy: false
        - date: 2025-05-31
          type: accident
          description: Multiple Vehicle - Third party hit rider
          fault: false
          personalInjury: true
          onCurrentPolicy: false
      convictions: []
      # - date: 2022-08-01
      #   code: SP30
      #   points: 3
      #   fine: 100
      #   ban: false
      nonMotoringConvictions: false
      medicalConditionsNotifiable: false
      insuranceRefused: false      # ever declined/cancelled/special terms
    noClaimsBonus:
      years: 2
      protected: false
      source: motorcycle           # motorcycle | car | none  (mirrored NCB from a car policy)

  - id: dad
    role: named-rider
    title: Mr
    firstName: Dad
    lastName: Rayner
    dateOfBirth: 1965-01-01
    gender: male
    maritalStatus: married
    relationshipToProposer: parent
    usageFrequency: infrequent
    email: dad@example.com
    phone: "07700900001"
    ukResidentSince: 1965-01-01
    homeowner: true
    employment:
      status: employed
      occupation: Engineer
      industry: Manufacturing
      secondJob: false
    licence:
      type: full
      number: RAYNE601019JX9AB
      dateObtained: 1985-03-14
      countryOfIssue: UK
      advancedRiding: none
    history:
      claims: []
      convictions: []
      nonMotoringConvictions: false
      medicalConditionsNotifiable: false
      insuranceRefused: false
    noClaimsBonus:
      years: 9
      protected: true
      source: motorcycle

# ---------------------------------------------------------------------------
# Addresses you could legitimately garage the bike at. Each one is a lever:
# postcode is usually the single biggest factor in a motorcycle premium.
# Only list addresses where the bike would genuinely be kept.
# ---------------------------------------------------------------------------
addresses:
  - id: home
    label: My flat
    houseNumber: "12"
    line1: Example Street
    line2: ""
    town: Bristol
    county: Bristol
    postcode: BS1 4ST
    residentSince: 2022-03-01
    overnightParking: street       # garage | driveway | secure-car-park | street | locked-compound
    homeowner: false

  - id: parents
    label: Parents' house
    houseNumber: "4"
    line1: Example Lane
    line2: ""
    town: Swindon
    county: Wiltshire
    postcode: SN1 1AA
    residentSince: 1998-01-01
    overnightParking: garage
    homeowner: true

# ---------------------------------------------------------------------------
# Defaults applied to every quote unless a scenario overrides them.
# ---------------------------------------------------------------------------
defaults:
  addressId: home
  namedRiders: []                  # rider ids besides the proposer, e.g. [dad]
  coverType: comprehensive         # comprehensive | tpft | tpo
  annualMileage: 3000
  voluntaryExcess: 250
  use: social                      # social | social-commuting | business
  paymentMethod: annual            # annual | monthly
  policyStartOffsetDays: 21        # quoting ~3 weeks ahead is usually cheapest
  ownerAndKeeper: true             # you are the registered keeper AND owner
  legalCover: false
  breakdownCover: false
  helmetAndLeathers: false
  pillionCover: true
  protectedNcb: false
  security:
    alarm: ""
    immobiliser: Honda HISS2 INJ (Thatcham 2)
    tracker: Datatool Stealth
    physicalDevice: Oxford Boss Disc Lock
    secureMarkings: Datatag
    chainAndGroundAnchor: true

# ---------------------------------------------------------------------------
# Optional. Only used to auto-resolve bikes from a reg / listing / screenshot.
# Both are optional; without them you can still add bikes manually.
#   DVLA VES key:   https://developer-portal.driver-vehicle-licensing.api.gov.uk
#   Anthropic key:  https://console.anthropic.com
# Prefer environment variables (DVLA_API_KEY / ANTHROPIC_API_KEY) over putting
# keys in this file.
# ---------------------------------------------------------------------------
apiKeys:
  dvla: ""
  anthropic: ""
