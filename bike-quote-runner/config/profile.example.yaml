# ---------------------------------------------------------------------------
# Your answer bank. Fill this in ONCE, honestly, and every quote journey gets
# filled from it. Copy to config/profile.yaml (gitignored) with `bqr init`.
#
# Everything here is an answer to a question a UK bike insurer will ask you.
# If a value is wrong the quote is worthless (and voidable), so take the time.
# ---------------------------------------------------------------------------

riders:
  # The first rider is the proposer / policyholder.
  - id: me
    role: proposer
    title: Mr
    firstName: Alex
    lastName: Example
    dateOfBirth: 1996-04-12
    gender: male
    maritalStatus: single          # single | married | cohabiting | divorced | widowed
    email: you@example.com
    phone: "07700900000"
    ukResidentSince: 1996-04-12    # same as your DOB if you were born here
    homeowner: false
    employment:
      status: employed             # employed | self-employed | student | unemployed | retired
      occupation: Illustrator
      industry: Information Technology
      secondJob: false
    licence:
      type: full                   # full | full-a2 | full-a1 | cbt | provisional
      number: ""
      provideNumber: false         # some journeys ask whether to hand it over at all
      dateObtained: 2024-06-20     # date you passed, or your CBT date
      countryOfIssue: UK
      ridingExperienceYears: 0     # continuous years riding, not years since you passed
      advancedRiding: none         # none, or the qualification: IAM, RoSPA, BikeSafe...
      bikingOrganisation: none     # none, or the club/organisation you belong to
    # A car licence and mirrored car NCB are worth real money on a bike policy,
    # and plenty of journeys ask for them.
    carLicence:
      held: true
      type: Full UK
      dateObtained: 2014-06-30
      noClaimsBonusYears: 5
      ownsCar: true
    history:
      # Every claim in the last 5 years, however small, fault or not.
      claims:
        - date: 2024-01-02
          type: other              # theft | accident | fire | vandalism | windscreen | other
          description: Other       # the wording the form's own dropdown uses
          fault: true
          ownVehicleCost: 1500
          thirdPartyCost: null
          personalInjury: false
          onCurrentPolicy: false
      convictions: []
      # - date: 2022-08-01
      #   code: SP30
      #   points: 3
      #   fine: 100
      #   ban: false
      nonMotoringConvictions: false
      medicalConditionsNotifiable: false
      insuranceRefused: false      # ever declined, cancelled or given special terms
    noClaimsBonus:
      years: 0
      protected: false
      source: none                 # motorcycle | car | none

  - id: dad
    role: named-rider
    title: Mr
    firstName: Pat
    lastName: Example
    dateOfBirth: 1962-09-23
    gender: male
    maritalStatus: married
    relationshipToProposer: parent
    usageFrequency: infrequent     # main | frequent | occasional | infrequent
    ukResidentSince: 1962-09-23
    homeowner: true
    employment:
      status: retired
      occupation: Retired
      industry: ""
      secondJob: false
    licence:
      type: full
      number: ""
      provideNumber: false
      dateObtained: 1981-01-31
      countryOfIssue: UK
      advancedRiding: none
      bikingOrganisation: none
    carLicence:
      held: true
      type: Full UK
      dateObtained: 1981-06-01
      noClaimsBonusYears: 9
      ownsCar: true
    history:
      claims: []
      convictions: []
      nonMotoringConvictions: false
      medicalConditionsNotifiable: false
      insuranceRefused: false
    noClaimsBonus:
      years: 9
      protected: true
      source: motorcycle

# ---------------------------------------------------------------------------
# Addresses the bike could genuinely be kept at. Postcode is usually the single
# biggest factor in a motorcycle premium, so a second honest address here is
# the most valuable lever in the whole file.
# ---------------------------------------------------------------------------
addresses:
  - id: home
    label: My flat
    subBuilding: Apartment 18      # flat or apartment, where there is one
    houseNumber: "2"
    line1: Example Street
    line2: ""
    town: Manchester
    county: Greater Manchester
    postcode: M4 7BB
    residentSince: 2022-03-01
    overnightParking: locked-compound  # garage | driveway | secure-car-park | street | locked-compound | carport
    homeowner: false

  - id: parents
    label: Parents' house
    subBuilding: ""
    houseNumber: "4"
    line1: Example Lane
    line2: ""
    town: Swindon
    county: Wiltshire
    postcode: SN1 1AA
    residentSince: 1998-01-01
    overnightParking: garage
    homeowner: true

# ---------------------------------------------------------------------------
# Applied to every quote unless a scenario overrides them.
# ---------------------------------------------------------------------------
defaults:
  addressId: home
  namedRiders: []                  # rider ids besides the proposer, e.g. [dad]
  coverType: comprehensive         # comprehensive | tpft | tpo
  annualMileage: 4000
  voluntaryExcess: 300
  use: social                      # social | social-commuting | business
  paymentMethod: monthly           # annual | monthly
  policyStartOffsetDays: 21        # quoting ~3 weeks ahead is usually cheapest
  ownerAndKeeper: true
  legalCover: false
  breakdownCover: false
  helmetAndLeathers: false
  pillionCover: true
  protectedNcb: false
  # Journeys ask you to pick the exact product from a list, so write what their
  # dropdown says. Blank means none fitted.
  security:
    alarm: ""
    immobiliser: Honda HISS2 INJ (Thatcham 2)
    tracker: Datatool Stealth
    physicalDevice: Oxford Boss Disc Lock
    secureMarkings: Datatag
    chainAndGroundAnchor: false

# ---------------------------------------------------------------------------
# Optional. Prefer environment variables (DVLA_API_KEY / ANTHROPIC_API_KEY).
#   DVLA VES key:   https://developer-portal.driver-vehicle-licensing.api.gov.uk
#   Anthropic key:  https://console.anthropic.com
# ---------------------------------------------------------------------------
apiKeys:
  dvla: ""
  anthropic: ""
